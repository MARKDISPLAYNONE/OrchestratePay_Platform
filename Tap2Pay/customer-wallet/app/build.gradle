plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.orchestratepay.wallet'
    compileSdk 34

    defaultConfig {
        applicationId "com.orchestratepay.wallet"
        minSdk 21          // HCE requires API 19; 21 gives us Material + coroutines
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // Backend base URL — override in local.properties for dev environments
        buildConfigField "String", "BASE_URL",
            "\"${project.findProperty('WALLET_BASE_URL') ?: 'https://api.orchestratepay.co.ke/'}\""
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    buildFeatures {
        buildConfig true   // required for BASE_URL BuildConfig field
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // ── Kotlin / Coroutines ───────────────────────────────────────────────
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // ── AndroidX ─────────────────────────────────────────────────────────
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'  // lifecycleScope

    // ── Networking ───────────────────────────────────────────────────────
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // ── Security ─────────────────────────────────────────────────────────
    // EncryptedSharedPreferences — stores the customer's phone number at rest
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}
