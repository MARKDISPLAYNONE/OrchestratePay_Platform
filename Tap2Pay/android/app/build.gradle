// App-module build.gradle
// Defines dependencies, SDK versions, and build config for the Android app.

plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'com.google.devtools.ksp' // replaces 'kotlin-kapt' — kapt cannot parse
                                  // Kotlin 2.2.10's metadata format for Room's
                                  // annotation processor; KSP (supported by
                                  // Room 2.6.0) resolves this cleanly.
}

android {
    compileSdk 35
    namespace "com.orchestratepay"

    defaultConfig {
        applicationId "com.orchestratepay"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        buildConfigField "String", "API_BASE_URL", '"https://api-sandbox.orchestratepay.co.ke/v1/"'
        buildConfigField "String", "WS_BASE_URL", '"wss://api-sandbox.orchestratepay.co.ke"'
        buildConfigField "String", "SENTRY_DSN", "\"${project.findProperty('SENTRY_DSN') ?: ''}\""
    }

    buildTypes {
        debug {
            debuggable true
            buildConfigField "String", "API_BASE_URL", '"http://localhost:3000/api/v1/"'
            buildConfigField "String", "WS_BASE_URL", '"ws://localhost:3000"'
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "API_BASE_URL", '"https://api.orchestratepay.co.ke/api/v1/"'
            buildConfigField "String", "WS_BASE_URL", '"wss://api.orchestratepay.co.ke"'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.11.0'

    implementation 'androidx.room:room-runtime:2.6.0'
    implementation 'androidx.room:room-ktx:2.6.0'
    ksp 'androidx.room:room-compiler:2.6.0' // replaces: kapt 'androidx.room:room-compiler:2.6.0'

    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.work:work-runtime-ktx:2.11.2'

    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.2'

    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'

    implementation 'com.google.mlkit:barcode-scanning:17.2.0'

    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    implementation 'io.sentry:sentry-android:7.6.0'

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core-ktx:1.12.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.7.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.2.1'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
    testImplementation project(':softpos')

    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'
}
