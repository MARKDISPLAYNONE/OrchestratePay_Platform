    <line x1="0" y1="5" x2="0" y2="7"/>
    <line x1="-7" y1="0" x2="-5" y2="0"/>
    <line x1="5" y1="0" x2="7" y2="0"/>
    <line x1="-5" y1="-5" x2="-3.5" y2="-3.5"/>
    <line x1="3.5" y1="-3.5" x2="5" y2="-5"/>
