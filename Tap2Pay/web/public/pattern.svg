<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" fill="none" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">

  <!-- Heart -->
  <g transform="translate(28,26) rotate(-15)">
