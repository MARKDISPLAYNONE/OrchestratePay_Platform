# secrets.template.yaml — DO NOT COMMIT with real values.
# Copy this file, fill in the base64-encoded values, and apply with:
#   kubectl apply -f secrets.yaml --namespace orchestratepay
#
# To base64-encode a value:
#   echo -n 'my-secret-value' | base64
#
# To create secrets from environment variables without a file (recommended):
#   kubectl create secret generic orchestratepay-secrets \
#     --from-literal=database-url="$DATABASE_URL" \
#     --from-literal=redis-url="$REDIS_URL" \
#     ...etc...
#     --namespace orchestratepay

---
apiVersion: v1
kind: Secret
metadata:
  name: orchestratepay-secrets
  namespace: orchestratepay
type: Opaque
data:
  # echo -n 'postgres://user:pass@host:5432/db' | base64
  database-url:           <BASE64_DATABASE_URL>
  # echo -n 'redis://:pass@host:6379' | base64
  redis-url:              <BASE64_REDIS_URL>
  # echo -n 'your-256-bit-jwt-secret' | base64
  jwt-secret:             <BASE64_JWT_SECRET>
  # Safaricom Daraja credentials
  daraja-consumer-key:    <BASE64_DARAJA_CONSUMER_KEY>
  daraja-consumer-secret: <BASE64_DARAJA_CONSUMER_SECRET>
  daraja-shortcode:       <BASE64_DARAJA_SHORTCODE>
  daraja-passkey:         <BASE64_DARAJA_PASSKEY>
  # Optional: Sentry DSN (leave empty string if not using Sentry)
  sentry-dsn:             <BASE64_SENTRY_DSN>
  # Africa's Talking SMS
  at-api-key:             <BASE64_AT_API_KEY>
  at-username:            <BASE64_AT_USERNAME>

---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: orchestratepay
type: Opaque
data:
  username: <BASE64_PG_USERNAME>
  password: <BASE64_PG_PASSWORD>

---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: orchestratepay
type: Opaque
data:
  password: <BASE64_REDIS_PASSWORD>
